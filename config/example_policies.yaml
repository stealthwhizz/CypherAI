# EXAMPLE 1: Strict Security Mode
# Use this for production environments or high-security applications
# ----------------------------------------------------------------------------
# thresholds:
#   block_on_critical: true
#   block_on_high: true
#   max_high_findings: 0
#   max_medium_findings: 2
#   risk_score_threshold: 50

# EXAMPLE 2: Development Mode
# More lenient settings for active development
# ----------------------------------------------------------------------------
# thresholds:
#   block_on_critical: true
#   block_on_high: false
#   max_high_findings: 10
#   max_medium_findings: 50
#   risk_score_threshold: 80

